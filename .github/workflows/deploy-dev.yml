name: Deploy to Development

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_REGISTRY: ghcr.io
  GITHUB_USERNAME: issach315
  IMAGE_TAG: dev-latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: |
          # Create Maven Wrapper if not exists
          if [ ! -f "./mvnw" ]; then
            mvn wrapper:wrapper
          fi
          
          # Build with retry logic
          for i in {1..3}; do
            echo "Build attempt $i/3"
            ./mvnw clean package -DskipTests -B && break || sleep 10
          done

      - name: Run tests
        run: |
          if [ -f "./mvnw" ]; then
            ./mvnw test -B
          else
            mvn test -B
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
          labels: |
            environment=dev
            version=${{ github.sha }}
            build-date=${{ github.run_id }}

      - name: Deploy to Development Server
        uses: appleboy/ssh-action@v1.0.0
        env:
          DEV_MYSQL_ROOT_PASSWORD: ${{ secrets.DEV_MYSQL_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.DEV_SERVER_PORT || 22 }}
          script: |
            echo "🚀 Deploying to Development Server..."
            
            # Create app directory if not exists
            sudo mkdir -p /opt/talentix-platform
            cd /opt/talentix-platform
            
            # Create .env file for development
            cat > .env << 'EOF'
            # Development Environment Configuration
            MYSQL_ROOT_PASSWORD=${{ secrets.DEV_MYSQL_ROOT_PASSWORD }}
            MYSQL_DATABASE=talentix_dev
            MYSQL_USER=talentix
            MYSQL_PASSWORD=talentix123
            
            # Docker Configuration
            DOCKER_REGISTRY=ghcr.io
            GITHUB_USERNAME=issach315
            IMAGE_TAG=dev-latest
            
            # Application Configuration
            SPRING_PROFILES_ACTIVE=dev
            SERVER_PORT=8081
            
            # Network Configuration (for external access)
            APP_HOST=0.0.0.0
            APP_PORT=8081
            MYSQL_PORT=3307
            EOF
            
            # Create docker-compose.dev.yml if not exists
            if [ ! -f "docker-compose.dev.yml" ]; then
              cat > docker-compose.dev.yml << 'DOCKER_COMPOSE'
            version: '3.8'
            
            services:
              mysql:
                image: mysql:8.0
                container_name: talentix-mysql-dev
                restart: unless-stopped
                environment:
                  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
                  MYSQL_DATABASE: ${MYSQL_DATABASE}
                  MYSQL_USER: ${MYSQL_USER}
                  MYSQL_PASSWORD: ${MYSQL_PASSWORD}
                ports:
                  - "${MYSQL_PORT:-3307}:3306"
                volumes:
                  - mysql_data:/var/lib/mysql
                healthcheck:
                  test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
                command: --default-authentication-plugin=mysql_native_password
            
              app:
                image: ${DOCKER_REGISTRY}/${GITHUB_USERNAME}/talentix-platform:${IMAGE_TAG}
                container_name: talentix-app-dev
                restart: unless-stopped
                environment:
                  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
                  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
                  SPRING_DATASOURCE_USERNAME: root
                  SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
                  SERVER_PORT: ${SERVER_PORT}
                  JAVA_OPTS: "-Xms256m -Xmx512m"
                ports:
                  - "${APP_HOST:-0.0.0.0}:${APP_PORT:-8081}:${SERVER_PORT}"
                depends_on:
                  mysql:
                    condition: service_healthy
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT}/actuator/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
            
            volumes:
              mysql_data:
            DOCKER_COMPOSE
            fi
            
            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Pull latest image
            echo "📥 Pulling latest image..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            
            # Stop and remove old containers
            echo "🛑 Stopping old containers..."
            docker-compose -f docker-compose.dev.yml down || true
            
            # Start new containers
            echo "🚀 Starting new containers..."
            docker-compose -f docker-compose.dev.yml up -d
            
            # Wait and check health
            echo "⏳ Waiting for application to start..."
            sleep 30
            
            # Health check
            echo "🔍 Running health check..."
            for i in {1..10}; do
              if curl -f http://localhost:${SERVER_PORT}/actuator/health; then
                echo "✅ Application is healthy!"
                break
              fi
              echo "⏳ Attempt $i/10 - Waiting..."
              sleep 5
            done
            
            echo "🎉 Deployment completed successfully!"

      - name: Send notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Development deployment successful!"
            echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          else
            echo "❌ Development deployment failed!"
            exit 1
          fi