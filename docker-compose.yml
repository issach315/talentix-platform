version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: talentix-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-talentix_dev}
      MYSQL_USER: ${MYSQL_USER:-talentix}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-talentix123}
    ports:
      - "0.0.0.0:3307:3306"  # Changed: Allows external access to MySQL
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - talentix-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talentix-app-dev
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-talentix_dev}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SERVER_PORT: 8081
    ports:
      - "0.0.0.0:8081:8081"  # Changed: Allows external access to your app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - talentix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - app_logs:/var/log/talentix-platform

volumes:
  mysql_data:
    name: talentix_mysql_data_dev
  app_logs:
    name: talentix_app_logs_dev

networks:
  talentix-network:
    name: talentix-network-dev
    driver: bridge